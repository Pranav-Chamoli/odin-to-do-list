<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <title>Odin To Do List</title>
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <div class="sidebar-header">
          <div class="page-title">Taskwork</div>
          <div class="sidebar-status">
            <div class="sidebar-status-number">10</div>
            <div class="sidebar-header-status">tasks remaining</div>
          </div>
        </div>
        <div class="sidebar-main">
          <div class="sidebar-sub-heading">
            <div class="sidebar-heading">projects</div>
            <button class="add-project-button">+</button>
          </div>
          <div class="project-list-container">
            <div class="project-item">
              <div class="project-title-round-highlighter"></div>
              <div class="project-title" data-index="1">Website Redesign</div>
              <div class="project-title-count">3</div>
            </div>
            <div class="project-item">
              <div class="project-title-round-highlighter"></div>
              <div class="project-title" data-index="2">Product Launch</div>
              <div class="project-title-count">17</div>
            </div>
            <div class="project-item">
              <div class="project-title-round-highlighter"></div>
              <div class="project-title" data-index="3">Personal</div>
              <div class="project-title-count">5</div>
            </div>
          </div>
        </div>
        <div class="sidebar-footer">
          <div class="project-list-count">10 projects</div>
        </div>
      </div>
      <div class="header">
        <div class="header-left-section">
          <div class="title-row">
            <div class="project-title-header-highlighter"></div>
            <div class="project-title-header">Website Redesign</div>
          </div>
          <div class="project-status">
            <div class="project-status-remaining">4 remaining ·</div>
            <div class="project-status-completed">1 completed</div>
          </div>
        </div>
        <div class="header-right-section">
          <button class="add-task-button">+ New task</button>
        </div>
      </div>
      <div class="main-content">
        <div class="task-heading"></div>
        <div class="task-list-container">
          <div class="task-item" data-index="1">
            <div class="checkbox"></div>
            <div class="task-title">Task 1</div>
            <div class="task-due-date">lorem</div>
            <div class="task-priority">High</div>
          </div>
          <div class="task-item" data-index="2">
            <div class="task-title">Task 1</div>
            <div class="task-due-date">lorem</div>
            <div class="task-priority">High</div>
          </div>
          <div class="task-item" data-index="3">
            <div class="task-title">Task 1</div>
            <div class="task-due-date">lorem</div>
            <div class="task-priority">High</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
